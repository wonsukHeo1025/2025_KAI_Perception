lidar:
  lidar_topic: /ouster/points
  frame_id: os_lidar

cameras:
  camera_1:
    image_topic: /camera_1/dbg_image
    projected_topic: /camera_1/projected_image
    image_size:
      width: 640
      height: 360
    frame_id: camera_l
  camera_2:
    image_topic: /camera_2/dbg_image
    projected_topic: /camera_2/projected_image
    image_size:
      width: 640
      height: 360
  frame_id: camera_c

chessboard:
  pattern_size:
    rows: 8
    columns: 9
  square_size_meters: 0.07

general:
  config_folder: /home/user1/ROS2_Workspace/ros2_ws/src/ros2_camera_lidar_fusion/config
  data_folder: /home/user1/ROS2_Workspace/ros2_ws/src/ros2_camera_lidar_fusion/data
  correspondence_file: ros2_camera_lidar_fusion_correspondences.txt
  camera_intrinsic_calibration: multi_camera_intrinsic_calibration.yaml
  camera_extrinsic_calibration: multi_camera_extrinsic_calibration.yaml
  slop: 0.1
  max_file_saved: 25
  keyboard_listener: True
  get_intrinsics: True
  get_extrinsics: True 