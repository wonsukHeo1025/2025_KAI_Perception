imu_preprocess_node:
  ros__parameters:
    # Pre-calibrated IMU bias values
    use_precalibrated_bias: true
    
    # Accelerometer bias [m/s²]
    bias_acc_x: -0.20184
    bias_acc_y: 0.02659
    bias_acc_z: -0.23629
    
    # Gyroscope bias [rad/s]
    bias_gyro_x: 0.001994
    bias_gyro_y: -0.014121
    bias_gyro_z: -0.023735
    
    # Low-pass filter settings
    lpf_cutoff: 5.0  # 0 to disable LPF