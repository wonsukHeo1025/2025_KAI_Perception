imu_preprocess_node:
  ros__parameters:
    # Pre-calibrated IMU bias values
    use_precalibrated_bias: true
    
    # Accelerometer bias [m/s²]
    bias_acc_x: 0.0680
    bias_acc_y: -0.0456
    bias_acc_z: -0.3034
    
    # Gyroscope bias [rad/s]
    bias_gyro_x: 0.0075
    bias_gyro_y: -0.0148
    bias_gyro_z: -0.0217
    
    # Low-pass filter settings
    lpf_cutoff: 20.0  # 0 to disable LPF